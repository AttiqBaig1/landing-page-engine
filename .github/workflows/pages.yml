name: Deploy web app to GitHub Pages

# Builds the browser version of the engine (web/) and publishes it to
# GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYODIDE_VERSION: "314.0.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pillow
      - name: Fetch Pyodide runtime
        run: |
          mkdir -p /tmp/pyo && cd /tmp/pyo
          npm pack pyodide@${PYODIDE_VERSION}
          tar xzf pyodide-*.tgz
      - name: Build web app
        run: python web/build_web.py --pyodide /tmp/pyo/package --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
