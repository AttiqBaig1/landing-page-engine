name: Build & deploy niche demo gallery

# Manual trigger only: GitHub Pages on a PRIVATE repo needs a paid plan
# (Pro/Team). If the repo is public or on a paid plan, add
#   push: { branches: [main] }
# below to rebuild the gallery automatically on every push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate one demo page per niche
        working-directory: engine
        run: python build_demo.py --out ../site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
